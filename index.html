<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Phones: "Add to Home screen" opens the course like an app (icon, full screen, no browser bar). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b1628" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="my-university" />
    <title>my-university</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('my-university:settings') || localStorage.getItem('qa-academy:settings') || '{}');
        var theme = (s.state && s.state.theme) || 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
