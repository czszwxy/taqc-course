<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Порівняння смартфонів — Gadgetly</title>
  <style>
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid #999; max-width: 36rem; }
    .cell { padding: 6px; border: 1px solid #ccc; }
    .head { font-weight: bold; }
  </style>
</head>
<body>
  <h1>X1 чи X1 Pro?</h1>
  <p><b>Порівняння смартфонів Gadgetly X1 і X1 Pro</b></p>
  <div class="grid">
    <div class="cell head">Характеристика</div><div class="cell head">Gadgetly X1</div><div class="cell head">Gadgetly X1 Pro</div>
    <div class="cell">Екран</div><div class="cell">6,1″ OLED</div><div class="cell">6,7″ OLED</div>
    <div class="cell">Пам'ять</div><div class="cell">128 ГБ</div><div class="cell">256 ГБ</div>
    <div class="cell">Батарея</div><div class="cell">4 000 мА·год</div><div class="cell">5 000 мА·год</div>
    <div class="cell">Ціна</div><div class="cell">18 999 грн</div><div class="cell">25 999 грн</div>
    <div class="cell">Гарантія</div><div class="cell">24 місяці</div><div class="cell">24 місяці</div>
  </div>
</body>
</html>
