<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gadgetly Pods 2 — Gadgetly</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a href="/"><img class="logo" src="logo.png" alt="Gadgetly — на головну" width="120" height="32"></a>
  </header>
  <main class="page">
    <div class="product">
      <img class="product-photo" src="pods-1600.jpg" alt="Бездротові навушники Gadgetly Pods 2 у відкритому білому футлярі" width="1600" height="1200">
      <div class="product-info">
        <h1>Навушники Gadgetly Pods 2</h1>
        <p class="price">2 499 грн</p>
        <p>Активне шумозаглушення, до 30 годин роботи з футляром, бездротова зарядка.</p>
      </div>
    </div>
    <section class="promo" aria-label="Акція">
      <img src="sale-wide.jpg" alt="Знижка 20 % на всі навушники до неділі" width="1600" height="500">
    </section>
    <section class="related" aria-labelledby="related-title">
      <h2 id="related-title">Схожі товари</h2>
      <ul class="related-list">
        <li><a href="/product/pods-lite"><img src="pods-lite.jpg" alt="">Gadgetly Pods Lite</a></li>
        <li><a href="/product/pods-max"><img src="pods-max.jpg" alt="">Gadgetly Pods Max</a></li>
        <li><a href="/product/pods-case"><img src="pods-case.jpg" alt="">Чохол для Pods 2</a></li>
      </ul>
    </section>
  </main>

</html>
