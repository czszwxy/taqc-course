<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Навушники — Gadgetly</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Перейти до основного вмісту</a>
  <header class="site-header">
    <a href="/">Gadgetly</a>
    <search>
      <form action="/search">
        <label class="visually-hidden" for="q">Пошук товарів</label>
        <input id="q" name="q" type="search" placeholder="Навушники, годинники…">
        <button type="submit">Знайти</button>
      </form>
    </search>
  </header>
  <main id="main">
    <h1>Навушники</h1>
    <ul class="products">
      <li class="product">
        <h2>Gadgetly Pods 2</h2>
        <button type="button" class="icon-button">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <span class="visually-hidden">Додати Gadgetly Pods 2 в обране</span>
        </button>
      </li>
      <li class="product">
        <h2>Gadgetly Pods Lite</h2>
        <button type="button" class="icon-button">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <span class="visually-hidden">Додати Gadgetly Pods Lite в обране</span>
        </button>
      </li>
    </ul>
  </main>
</body>
</html>
